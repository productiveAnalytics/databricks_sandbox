env:
  - name: SQL_WAREHOUSE_ID
    value: "${resources.sql_warehouse}"
  - name: LAKEBASE_PROJECT
    value: "bakehouse-rewards-app"
  - name: LAKEBASE_BRANCH
    value: "production"

resources:
  sql_warehouse:
    id: "auto"
    permission: "CAN_USE"

command:
  - sh
  - -c
  - "npm run build && npm start"