<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakehouse Rewards - Customer Portal</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4c0 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #8B4513;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #8B4513;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            color: #8B4513;
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .customer-select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f8f8;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [customers, setCustomers] = useState([]);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [redemptions, setRedemptions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetchCustomers();
            }, []);

            useEffect(() => {
                if (selectedCustomer) {
                    fetchTransactions(selectedCustomer.customer_email);
                    fetchRedemptions(selectedCustomer.customer_email);
                }
            }, [selectedCustomer]);

            const fetchCustomers = async () => {
                try {
                    console.log('Fetching customers...');
                    const response = await fetch('/api/customers');
                    const data = await response.json();
                    console.log('Customers response:', data);
                    
                    if (data.customers && data.customers.length > 0) {
                        setCustomers(data.customers);
                        setSelectedCustomer(data.customers[0]);
                    } else {
                        setError('No customers found');
                    }
                    setLoading(false);
                } catch (err) {
                    console.error('Error fetching customers:', err);
                    setError('Failed to load customers: ' + err.message);
                    setLoading(false);
                }
            };

            const fetchTransactions = async (email) => {
                try {
                    const response = await fetch(`/api/transactions/${encodeURIComponent(email)}`);
                    const data = await response.json();
                    console.log('Transactions response:', data);
                    setTransactions(data.transactions || []);
                } catch (err) {
                    console.error('Failed to load transactions:', err);
                }
            };

            const fetchRedemptions = async (email) => {
                try {
                    const response = await fetch(`/api/redemptions/${encodeURIComponent(email)}`);
                    const data = await response.json();
                    console.log('Redemptions response:', data);
                    setRedemptions(data.redemptions || []);
                } catch (err) {
                    console.error('Failed to load redemptions:', err);
                }
            };

            const formatNumber = (num) => {
                const n = Number(num);
                return isNaN(n) ? '0' : n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            };

            const formatCurrency = (num) => {
                const n = Number(num);
                return isNaN(n) ? '$0.00' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            if (loading) {
                return (
                    <div className="container">
                        <div className="loading">⏳ Loading customer data from Unity Catalog...</div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="container">
                        <div className="error">{error}</div>
                    </div>
                );
            }

            if (!selectedCustomer) {
                return (
                    <div className="container">
                        <div className="empty">No customers available</div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>🥐 Bakehouse Rewards</h1>
                        <p>Customer Loyalty Portal - Unity Catalog Integration</p>
                    </div>

                    <select 
                        className="customer-select"
                        value={selectedCustomer.customer_email}
                        onChange={(e) => {
                            const customer = customers.find(c => c.customer_email === e.target.value);
                            if (customer) setSelectedCustomer(customer);
                        }}
                    >
                        {customers.map(customer => (
                            <option key={customer.customer_email} value={customer.customer_email}>
                                {customer.customer_email}
                            </option>
                        ))}
                    </select>

                    <div className="stats-grid">
                        <div className="stat-card">
                            <h3>Total Points</h3>
                            <div className="value">{formatNumber(selectedCustomer.total_points)}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Available Points</h3>
                            <div className="value">{formatNumber(selectedCustomer.points_available)}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Total Spent</h3>
                            <div className="value">{formatCurrency(selectedCustomer.total_spent)}</div>
                        </div>
                        <div className="stat-card">
                            <h3>Transactions</h3>
                            <div className="value">{formatNumber(selectedCustomer.transaction_count)}</div>
                        </div>
                    </div>

                    <div className="section">
                        <h2>📊 Recent Transactions</h2>
                        {transactions.length === 0 ? (
                            <div className="empty">No transactions found</div>
                        ) : (
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Transaction ID</th>
                                        <th>Category</th>
                                        <th>Amount</th>
                                        <th>Points Earned</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {transactions.map(txn => (
                                        <tr key={txn.transaction_id}>
                                            <td>{txn.transaction_date || 'N/A'}</td>
                                            <td>{txn.transaction_id || 'N/A'}</td>
                                            <td><span className="badge badge-info">{txn.product_category || 'N/A'}</span></td>
                                            <td>{formatCurrency(txn.amount)}</td>
                                            <td>+{formatNumber(txn.points_earned)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>

                    <div className="section">
                        <h2>🎁 Redemption History</h2>
                        <div className="empty">Lakebase integration coming soon...</div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
